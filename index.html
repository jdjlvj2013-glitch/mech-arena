<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mech Arena</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#hp{position:absolute;top:14px;left:14px;width:240px;height:18px;background:#300;border:2px solid #fff;border-radius:4px}
#hpf{height:100%;width:100%;background:linear-gradient(#5f5,#2a2)}
#info{position:absolute;top:40px;left:14px;font-size:15px;text-shadow:0 0 3px #000}
#xh{position:absolute;left:50%;top:42%;width:26px;height:26px;margin:-13px;border:2px solid #fff8;border-radius:50%}
#xh:after{content:'';position:absolute;left:11px;top:11px;width:4px;height:4px;background:#f44;border-radius:50%}
#joy{position:absolute;left:30px;bottom:30px;width:150px;height:150px;border-radius:50%;background:#fff2;border:2px solid #fff5;pointer-events:auto}
#knob{position:absolute;left:45px;top:45px;width:60px;height:60px;border-radius:50%;background:#fff6}
.btn{position:absolute;border-radius:50%;background:#f003;border:3px solid #f66;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;text-align:center}
#bMG{right:40px;bottom:50px;width:110px;height:110px}
#bRK{right:170px;bottom:40px;width:84px;height:84px;background:#f803;border-color:#fa4}
#aim{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto}
#msg{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:#000a;font-size:44px;font-weight:bold}
#msg button{margin-top:20px;font-size:26px;padding:14px 40px;border-radius:12px;border:0;background:#fa4;color:#000;font-weight:bold}
#ammo{position:absolute;top:64px;left:14px;font-size:14px;text-shadow:0 0 3px #000}#ammo .bar{width:180px;height:8px;background:#0008;border:1px solid #fff8;margin:3px 0 6px}#gunf{height:100%;background:#ff6}
.pip{display:inline-block;width:12px;height:18px;border:1px solid #fff;margin-left:4px;vertical-align:middle;position:relative;background:#0006}.pip i{position:absolute;bottom:0;left:0;right:0}
#bRL{right:60px;bottom:180px;width:60px;height:60px;background:#48f3;border-color:#8af}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.6}
</style></head><body>
<div id="hud"><div id="aim"></div><div id="hp"><div id="hpf"></div></div><div id="info"></div><div id="ammo"><div id="gunt">GUN</div><div class="bar"><div id="gunf"></div></div><div>ROCKETS <span id="rkp"></span></div></div><div id="xh"></div>
<div id="joy"><div id="knob"></div></div><div class="btn" id="bMG">GUN</div><div class="btn" id="bRK">ROCKET</div><div class="btn" id="bRL">R</div>
<div id="hint">WASD move · mouse aim (click to lock) · LMB/Space gun · RMB/Q rockets · R reload</div></div>
<div id="msg"><div id="mt"></div><button id="rs">RESTART</button></div>
<script type="module" src="game.js?v=2"></script></body></html>
